<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quality Control Report</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #333333;
            background: #ffffff;
        }

        /* ── Header ── */
        .header {
            border-top: 4px solid #0085a4;
            padding: 28px 36px 20px;
        }

        .header-label {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #0085a4;
            margin-bottom: 10px;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #111111;
            line-height: 1.3;
        }

        .header-meta {
            margin-top: 10px;
            font-size: 11px;
            color: #666666;
        }

        .header-meta strong {
            color: #111111;
            font-weight: bold;
        }

        .divider {
            height: 1px;
            background: #e5e5e5;
            margin: 0 36px;
        }

        /* ── Body ── */
        .body {
            padding: 24px 36px 32px;
        }

        /* ── Section title ── */
        .section-label {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #0085a4;
            margin-bottom: 14px;
        }

        /* ── Chart block ── */
        .chart-block {
            margin-bottom: 32px;
            page-break-inside: avoid;
        }

        .chart-index {
            font-size: 13px;
            font-weight: bold;
            color: #0085a4;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .chart-block img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #e5e5e5;
        }

        /* ── Line stats ── */
        .stats {
            display: table;
            width: 100%;
            border-collapse: collapse;
            margin-top: 1px;
            border: 1px solid #e5e5e5;
            border-top: none;
        }

        .stat {
            display: table-cell;
            width: 25%;
            padding: 10px 14px;
            border-right: 1px solid #e5e5e5;
            vertical-align: top;
        }

        .stat:last-child { border-right: none; }

        .stat-label {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #111111;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #0085a4;
            line-height: 1;
        }

        .stat.total .stat-value {
            color: #333333;
        }

        /* ── Pie table ── */
        .pie-wrap {
            border: 1px solid #e5e5e5;
            border-top: none;
        }

        .pie-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .pie-table th {
            background: #0085a4;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 7px 12px;
            text-align: left;
        }

        .pie-table td {
            padding: 7px 12px;
            border-bottom: 1px solid #efefef;
            color: #333333;
        }

        .pie-table tr:last-child td {
            border-bottom: none;
        }

        .pie-table .pct {
            font-weight: bold;
            color: #0085a4;
        }

        .pie-table tfoot td {
            background: #f5f5f5;
            font-weight: bold;
            color: #111111;
            border-top: 1px solid #e5e5e5;
            border-bottom: none;
        }

        /* ── Footer ── */
        .footer {
            padding: 14px 36px;
            border-top: 1px solid #e5e5e5;
            font-size: 9px;
            color: #aaaaaa;
            display: table;
            width: 100%;
        }

        .footer-left  { display: table-cell; text-align: left; }
        .footer-right { display: table-cell; text-align: right; }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-label">Quality Control Report</div>
    <div class="header-title" th:text="${qcFormName}">Form Name</div>
    <div class="header-meta">
        Period:&nbsp;
        <strong th:text="${startDateTime}">Start</strong>
        &nbsp;—&nbsp;
        <strong th:text="${endDateTime}">End</strong>
    </div>
</div>

<div class="divider"></div>

<!-- BODY -->
<div class="body">

    <div class="section-label">Inspection Data</div>

    <th:block th:each="chart, iterStat : ${charts}">
        <div class="chart-block">

            <div class="chart-index">
                Chart <span th:text="${iterStat.count}">1</span>
                &nbsp;·&nbsp;
                <span th:if="${chart.chartType == 'line'}">Trend</span>
                <span th:if="${chart.chartType == 'pie'}">Distribution</span>
            </div>

            <img th:if="${chart.chartImage != null and !chart.chartImage.isEmpty()}"
                 th:src="@{${chart.chartImage}}" alt="Chart" />

            <!-- Line stats -->
            <th:block th:if="${chart.chartType == 'line'}">
                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">Maximum</div>
                        <div class="stat-value" th:text="${chart.max}">—</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Minimum</div>
                        <div class="stat-value" th:text="${chart.min}">—</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Average</div>
                        <div class="stat-value" th:text="${chart.average}">—</div>
                    </div>
                    <div class="stat total">
                        <div class="stat-label">Data Points</div>
                        <div class="stat-value" th:text="${chart.total}">—</div>
                    </div>
                </div>
            </th:block>

            <!-- Pie breakdown -->
            <th:block th:if="${chart.chartType == 'pie'}">
                <div class="pie-wrap">
                    <table class="pie-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Count</th>
                                <th>Percentage</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${chart.info}">
                                <td th:text="${item.label}">Label</td>
                                <td th:text="${item.count}">0</td>
                                <td class="pct"><span th:text="${item.percentage}">0.00</span>%</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td>Total</td>
                                <td th:text="${chart.total}">0</td>
                                <td>100%</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </th:block>

        </div>
    </th:block>

</div>

<!-- FOOTER -->
<div class="footer">
    <div class="footer-left">FPS MES · Quality Control System</div>
    <div class="footer-right" th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm')}">Date</div>
</div>

</body>
</html>
