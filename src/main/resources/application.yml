spring:
  profiles:
    active: dev

  application:
    name: mes-qc-service

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        transaction.jta.platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

  datasource:
    hikari:
      minimum-idle: 10          # Minimum number of idle connections in the pool
      maximum-pool-size: 20     # Maximum number of connections (active + idle)
      idle-timeout: 30000       # 30 seconds - Time a connection can remain idle before being closed
      max-lifetime: 1800000      # 30 minutes - Maximum lifetime of a connection
      leak-detection-threshold: 60000  # 60 seconds - Time a connection can be borrowed before flagged as leaked
      connection-timeout: 45000 # 45 seconds - Time to wait for a new connection before timing out

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:erikyu.98414@gmail.com}
    password: ${MAIL_PASSWORD:zaha mkbx kjmk gbal}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8090
  servlet:
    context-path: /api/qc

  tomcat:
    threads:
      max: 200
    connection-timeout: 20000

java:
  awt:
    headless: false

logging:
  level:
    org.hibernate: WARN
    org.mongodb: WARN
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true

  metrics:
    export:
      defaults:
        enabled: true

qc:
  snapshot:
    api:
      url: ${QC_SNAPSHOT_API_URL:http://localhost:8081}
  legacy-migration:
    leader-role-id: ${LEGACY_MIGRATION_LEADER_ROLE_ID:6}
    supervisor-role-id: ${LEGACY_MIGRATION_SUPERVISOR_ROLE_ID:7}
    flow2-approval-template-id: ${LEGACY_MIGRATION_FLOW2_TEMPLATE_ID:69e7c31db26b380d82fae8e8}
    flow3-approval-template-id: ${LEGACY_MIGRATION_FLOW3_TEMPLATE_ID:69e7c32db26b380d82fae8e9}
    flow4-approval-template-id: ${LEGACY_MIGRATION_FLOW4_TEMPLATE_ID:68e699a946d9997100ff644a}

# File upload configuration
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}
    base-url: ${FILE_UPLOAD_BASE_URL:}

# Multipart file upload limits
spring.servlet.multipart:
  enabled: true
  max-file-size: 50MB
  max-request-size: 50MB